<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的首頁</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --accent-soft: #e0e7ff;
    }

    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #818cf8;
      --accent-soft: #312e81;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border-radius: 20px;
      padding: 40px 32px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      animation: fadeUp 0.6s ease-out;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #a855f7);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 40px;
      color: #fff;
      font-weight: bold;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .bio {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 28px;
    }

    .links a {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: var(--accent-soft);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .links a:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .toggle {
      background: none;
      border: 1px solid var(--muted);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
    }

    .footer {
      margin-top: 24px;
      font-size: 13px;
      color: var(--muted);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="avatar">Y</div>
    <h1>你的名字</h1>
    <p class="subtitle">網站開發者 ／ 學習者 ／ 創作者</p>
    <p class="bio">
      歡迎來到我的首頁！這裡會分享我的作品、學習紀錄與一些有趣的想法。
      請把這段文字換成你自己的自我介紹。
    </p>

    <nav class="links">
      <a href="https://github.com/" target="_blank" rel="noopener">🐙 GitHub</a>
      <a href="mailto:you@example.com">📧 寫信給我</a>
      <a href="#">📝 我的部落格（尚未建立）</a>
    </nav>

    <button class="toggle" id="themeToggle">🌙 切換深色模式</button>

    <p class="footer">© 2026 · 用 GitHub Pages 部署</p>
  </main>

  <script>
    const toggle = document.getElementById("themeToggle");
    const saved = localStorage.getItem("theme");

    if (saved === "dark") {
      document.body.classList.add("dark");
      toggle.textContent = "☀️ 切換淺色模式";
    }

    toggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      toggle.textContent = isDark ? "☀️ 切換淺色模式" : "🌙 切換深色模式";
    });
  </script>

</body>
</html>
